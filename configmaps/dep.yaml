apiVersion: v1
kind: Namespace
metadata:
  name: moon
---    
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-moon
  labels:
    app: web-moon
  namespace: moon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-moon
  template:
    metadata:
      labels:
        app: web-moon
    spec:
      containers:
      - name: main
        image: nginx:alpine
        volumeMounts:
        - name: data-vol
          mountPath: "/usr/share/nginx/html"
      volumes:
      - name: data-vol
        configMap:
          name: configmap-web-moon-html
